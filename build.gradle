import groovy.json.JsonSlurper
import groovy.json.JsonOutput

plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.2.0" apply false
}

def loader = property("loom.platform")
def isFabric = loader == "fabric"
def isNeoForge = loader == "neoforge"
def unobfuscated = stonecutter.eval(stonecutter.current.version, ">=26.1")

if (isFabric) {
    apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
} else if (isNeoForge) {
    apply plugin: 'net.neoforged.moddev'
}

base.archivesName = project.archives_base_name
version = "${stonecutter.current.version}-${mod_version}"
group = rootProject.maven_group

def javaRelease = unobfuscated ? 25 : 21

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = sourceCompatibility
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaRelease
}

tasks.named('jar') {
    inputs.property('minecraftVersion', stonecutter.current.version)
}

if (unobfuscated && isFabric) {
    configurations {
        implementation.extendsFrom(modImplementation)
        api.extendsFrom(modApi)
        compileOnly.extendsFrom(modCompileOnly)
        runtimeOnly.extendsFrom(modRuntimeOnly)
    }
}

if (isFabric) {
    configurations.configureEach {
        resolutionStrategy { force("net.fabricmc:fabric-loader:${fabric_loader_version}") }
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://maven.terraformersmc.com/" }
    
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven"; name = "Modrinth" } }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    if (isFabric) {
        minecraft "com.mojang:minecraft:${stonecutter.current.version}"
        if (!unobfuscated) mappings loom.officialMojangMappings()
        
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }

    def addOptionalModrinthDep = { propName, modId ->
        def ver = project.findProperty(propName) ?: ""
        if (ver && ver != "[VERSIONED]") {
            def baseName = propName - '_version'
            def compileMcVersion = project.findProperty("${baseName}_compile_mc") ?: stonecutter.current.version
            def depString = "maven.modrinth:${modId}:${compileMcVersion}-${ver}-${loader}"
            add(isFabric ? 'modCompileOnly' : 'compileOnly', depString)
        }
    }

    addOptionalModrinthDep("factory_api_version", "nkTZHOLD")
    addOptionalModrinthDep("legacy4j_version", "gHvKJofA")

    def modmenuVer = project.findProperty("modmenu_version") ?: ""
    if (isFabric && modmenuVer && modmenuVer != "[VERSIONED]") {
        modImplementation("com.terraformersmc:modmenu:${modmenuVer}")
    }
}

def aw = "${mod_id}.accesswidener"

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}


if (isFabric) {
    loom {
        accessWidenerPath = stonecutter.process(getRootProject().file("src/main/resources/${aw}"), "build/dev.aw")
    }
} else if (isNeoForge) {
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
    neoForge {
        version = neoforge_version
        def at = file('src/main/resources/META-INF/accesstransformer.cfg')
        if (at.exists()) accessTransformers.from(at.absolutePath)
        
        mods {
            create(mod_id) { sourceSet project.sourceSets.main }
        }
        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            }
        }
    }
}

processResources {
    def mcVersion = stonecutter.current.version
    def (major, minor) = mcVersion.split('-')[0].tokenize('.')
    def mcVersionNext = "${major}.${minor.toInteger() + 1}"
    def descriptor = isFabric ? 'fabric.mod.json' : 'META-INF/neoforge.mods.toml'

    def expandProps = [
            "version": mod_version, "mod_id": mod_id, "mod_name": mod_name,
            "mod_license": mod_license, "mod_description": mod_description,
            "mod_authors": mod_authors,
            "mod_credits": mod_credits, "mod_homepage": mod_homepage,
            "mod_source": mod_source, "mod_issues": mod_issues,
            "mc_version": isFabric ? "${mcVersion}-" : mcVersion, "mc_version_next": mcVersionNext, "aw": aw,
            "minecraft_dependency": mcVersion.contains('-') ?
                    mcVersion.replaceFirst(/-snapshot-(\d+)$/, '-alpha.$1')
                            .replaceFirst(/-(pre|rc)-(\d+)$/, '-$1.$2') : "~${mcVersion}-"
    ]
    
    inputs.properties(expandProps)

    exclude 'META-INF/mods.toml'
    exclude isFabric ? 'META-INF/neoforge.mods.toml' : 'fabric.mod.json'
    if (!isFabric) exclude "${mod_id}-fabric.mixins.json"
    filesMatching(descriptor) { expand expandProps }
    
    doLast {
        def fabricModJson = file("${outputs.files.asPath}/fabric.mod.json")
        if (fabricModJson.exists()) {
            def parsed = new JsonSlurper().parse(fabricModJson)
            def modmenuVer = project.findProperty('modmenu_version')
            if (!modmenuVer || modmenuVer == '[VERSIONED]') {
                parsed.entrypoints.remove('modmenu')
            }
            if (parsed.contributors instanceof List) {
                def cleanList = parsed.contributors.findAll { it?.toString()?.trim() }
                if (cleanList.isEmpty()) {
                    parsed.remove("contributors")
                } else {
                    parsed.contributors = cleanList
                }
            }
            fabricModJson.text = JsonOutput.prettyPrint(JsonOutput.toJson(parsed))
        }
    }
}

def releaseJar = tasks.named(isFabric && !unobfuscated ? 'remapJar' : 'jar')
def buildJar = tasks.register('buildJar') {
    def source = releaseJar.flatMap { it.archiveFile }
    def destination = rootProject.layout.buildDirectory.file(
        "libs/${mod_version}/${archives_base_name}-${project.version}-${loader}.jar")
    inputs.file(source)
    outputs.file(destination)
    doLast {
        project.copy {
            from source
            into destination.get().asFile.parentFile
            rename { destination.get().asFile.name }
        }
    }
}
tasks.named('assemble') { dependsOn buildJar }

if (isFabric) apply from: rootProject.file('gradle/publish.gradle')
